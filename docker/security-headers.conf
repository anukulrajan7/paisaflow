# Shared response headers. nginx's add_header is NOT inherited by a block
# that declares its own add_header, so every location includes this file.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# - 'wasm-unsafe-eval' lets sql.js instantiate SQLite compiled to WebAssembly.
# - connect-src openrouter.ai is the ONLY remote host the app may call, and
#   only when the user adds their own key.
# - style-src 'unsafe-inline' covers react-native-web's injected styles.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://openrouter.ai; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
