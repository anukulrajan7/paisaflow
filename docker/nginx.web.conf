# nginx config for the PaisaFlow web container.
# Served behind the host's Caddy (TLS + optional brotli/zstd at the edge).

map $sent_http_content_type $pf_cache {
    default                         "public, max-age=3600";
    text/html                       "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;

    # Compression: serve pre-compressed .gz built in the image, else gzip live.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm text/javascript;

    # --- Headers (see security-headers.conf; repeated per location) -------
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control $pf_cache always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets: cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The app is a single-page app under /app/ — any deep link falls back to
    # its index.html (which is never cached, so new deploys show up at once).
    location /app {
        try_files $uri $uri/ /app/index.html;
    }

    # Landing page and public files (screenshots, favicon, theme-init).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
